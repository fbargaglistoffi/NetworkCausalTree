name: Revised NCT smoke simulation
on:
  pull_request:
    paths:
      - 'tools/nct-smoke/**'
      - '.github/workflows/nct-hardening-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      R_KEEP_PKG_SOURCE: yes
      NCT_SMOKE_REPS: '12'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::testthat
          needs: check
      - name: Apply the prepared runtime fixes to the CI workspace
        run: |
          python3 tools/nct-smoke/apply_hardening.py
          mkdir -p nct-smoke-results
          git diff -- R > nct-smoke-results/applied_runtime.patch
          git rev-parse HEAD > nct-smoke-results/validation_commit.txt
      - name: Run the known-effect simulation
        run: Rscript tools/nct-smoke/run_smoke.R 2>&1 | tee nct-smoke-results/simulation.log
        shell: bash
      - name: Run the existing package regression tests against revised code
        if: success()
        run: Rscript -e 'testthat::test_local(".", reporter = "summary", stop_on_failure = TRUE)' 2>&1 | tee nct-smoke-results/regression-tests.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revised-nct-smoke-results
          path: nct-smoke-results/
