name: Revised NCT smoke simulation
on:
  pull_request:
    paths:
      - 'tools/nct-smoke/**'
      - '.github/workflows/nct-hardening-smoke.yml'
permissions:
  contents: read
concurrency:
  group: nct-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      R_KEEP_PKG_SOURCE: yes
      NCT_SMOKE_REPS: '12'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Select the exact merged revised source
        run: |
          cp -R tools/nct-smoke /tmp/nct-smoke
          git fetch --depth=1 origin 7b14bc10d473d86ff369b1acd0f0a522d54c01d6
          git checkout --detach 7b14bc10d473d86ff369b1acd0f0a522d54c01d6
          mkdir -p nct-smoke-results
          git rev-parse HEAD > nct-smoke-results/validation_commit.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgload
            any::testthat
          needs: check
      - name: Run the known-effect simulation
        run: Rscript /tmp/nct-smoke/run_smoke.R 2>&1 | tee nct-smoke-results/simulation.log
        shell: bash
      - name: Run all package regression tests against the merged revised code
        if: success()
        run: Rscript -e 'testthat::test_local(".", reporter = "summary", stop_on_failure = TRUE)' 2>&1 | tee nct-smoke-results/regression-tests.log
        shell: bash
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revised-nct-smoke-results
          path: nct-smoke-results/
